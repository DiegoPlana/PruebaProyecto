name: Navegación y diseño responsive
on:
  push:
    branches: ['design/**']
  pull_request:
    paths: ['public/**', 'frontend/**', 'src/server.mjs', 'scripts/build-pages.mjs', 'test/browser-ui.py', 'test/web-routes.test.mjs', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: python -m pip install playwright==1.51.1
      - run: python -m playwright install --with-deps chromium
      - name: Arrancar servidor sin datos reales
        run: DATABASE_URL=postgres://unused:unused@127.0.0.1:1/unused node src/server.mjs > /tmp/santa-quiteria-ui.log 2>&1 &
      - name: Comprobar navegación, formularios y responsive
        run: python test/browser-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-diseno
          path: artifacts/design/
          retention-days: 14
