services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: albergue
      POSTGRES_DB: albergue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U albergue -d albergue']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://albergue:${POSTGRES_PASSWORD}@db:5432/albergue
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'npm run migrate && npm start']
    restart: unless-stopped
volumes:
  postgres_data:
